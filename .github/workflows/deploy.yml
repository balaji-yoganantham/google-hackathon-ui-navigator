name: Deploy to GCP

on:
  push:
    branches: [deployment]

env:
  PROJECT_ID: project-70591921-7d7a-4043-ba8
  REGION: us-central1
  AR_REPO: ui-navigator
  SERVICE_NAME: ui-navigator-backend

jobs:
  deploy-backend:
    name: Build & Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      service_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Authenticate Docker to Artifact Registry
        run: |
          echo $(gcloud auth print-access-token) | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGION }}-docker.pkg.dev

      - name: Create AR repository (idempotent)
        run: |
          gcloud artifacts repositories create ${{ env.AR_REPO }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} || true

      - name: Build & push Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/backend:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          flags: --allow-unauthenticated
          env_vars: |
            USE_VERTEX_AI=True
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=us-central1
            GEMINI_MODEL=gemini-1.5-flash-002

      - name: Set Cloud Run scaling and timeout for SSE
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --min-instances=1 \
            --max-instances=1 \
            --timeout=3600 \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}
